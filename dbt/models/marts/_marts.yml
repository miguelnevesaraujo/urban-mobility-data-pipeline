version: 2
models:
  - name: mart_station_unavailability
    description: >
      Station-level bicycle unavailability metrics
      calculated from eligible Citi Bike observations.

    columns:
      - name: station_id
        description: Unique station identifier
        data_tests:
          - unique
          - not_null

      - name: eligible_snapshots
        description: Number of eligible station observations
        data_tests:
          - not_null

      - name: unavailability_rate_pct
        description: Percentage of eligible observations with zero bikes
        data_tests:
          - not_null

  - name: mart_hourly_unavailability
    description: >
      Bicycle unavailability metrics grouped by
      local hour of day in New York City.

    columns:
      - name: hour_of_day
        description: Local hour of day, ranging from 0 to 23
        data_tests:
          - unique
          - not_null

      - name: eligible_observations
        description: Number of eligible observations during the hour
        data_tests:
          - not_null

      - name: unavailability_rate_pct
        description: Percentage of eligible observations with zero bikes
        data_tests:
          - not_null
  
  - name: mart_station_data_quality
    description: >
      Summarizes station availability observations by
      data quality and eligibility category. Provides
      observation counts and percentages to support
      data quality monitoring.

    columns:
      - name: quality_category
        description: >
          Classification of each observation based on
          eligibility and data quality rules.
        data_tests:
          - not_null
          - unique

      - name: observation_count
        description: >
          Number of observations assigned to the
          corresponding quality category.
        data_tests:
          - not_null

      - name: percentage_of_total
        description: >
          Percentage of all observations belonging
          to the corresponding quality category.
        data_tests:
          - not_null